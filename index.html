<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна | Secure Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --cyan: #00f3ff;
            --dark-bg: #030613;
            --panel-bg: rgba(4, 13, 33, 0.85);
            --border: 1px solid rgba(0, 243, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Share Tech Mono', monospace; }

        body {
            background-color: var(--dark-bg);
            color: var(--cyan);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Канвас для фону (частинки) */
        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 0; opacity: 0.6; }

        /* Лінії сканування (CRT ефект) */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; z-index: 10; pointer-events: none;
        }

        /* Основний контейнер */
        .dashboard {
            position: relative; z-index: 5;
            width: 90%; max-width: 1200px; display: grid;
            grid-template-columns: 1fr 2fr; gap: 20px;
            animation: bootUp 2s ease-out;
        }

        /* Панелі зі скошеними кутами */
        .panel {
            background: var(--panel-bg); border: var(--border);
            padding: 30px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(10px); position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }
        
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
        }

        /* Глітч заголовок */
        h1 {
            font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 10px; text-shadow: 0 0 10px var(--cyan);
            position: relative; display: inline-block;
        }
        h1::before, h1::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.8;
        }
        h1::before { left: 2px; text-shadow: -2px 0 red; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim 3s infinite linear alternate-reverse; }
        h1::after { left: -2px; text-shadow: -2px 0 blue; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 44px, 0); }
            20% { clip: rect(85px, 9999px, 59px, 0); }
            40% { clip: rect(33px, 9999px, 98px, 0); }
            60% { clip: rect(71px, 9999px, 23px, 0); }
            80% { clip: rect(14px, 9999px, 86px, 0); }
            100% { clip: rect(56px, 9999px, 12px, 0); }
        }

        h2 { font-size: 1.2em; border-bottom: 1px solid rgba(0, 243, 255, 0.3); padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }
        p { margin-bottom: 15px; font-size: 0.9em; line-height: 1.5; color: #a0d8ef; }

        /* Термінал */
        .terminal { font-size: 0.85em; color: #0f0; background: rgba(0,20,0,0.5); padding: 15px; border: 1px solid #0f0; height: 150px; overflow-y: auto; margin-bottom: 20px; }
        .terminal p { color: #0f0; margin: 2px 0; text-shadow: 0 0 5px #0f0; }

        /* Форма зв'язку */
        form { display: flex; flex-direction: column; gap: 15px; }
        .input-group { position: relative; }
        input, textarea {
            width: 100%; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--cyan); padding: 12px; font-family: inherit; transition: 0.3s;
        }
        input:focus, textarea:focus { outline: none; background: rgba(0, 243, 255, 0.15); border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        input::placeholder, textarea::placeholder { color: rgba(0, 243, 255, 0.4); }
        
        button {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
            padding: 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        button:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }

        @keyframes bootUp {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* Адаптивність */
        @media (max-width: 800px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="scanlines"></div>

    <div class="dashboard">
        <div class="panel">
            <h2>> Системний статус</h2>
            <div class="terminal" id="terminal-output">
                </div>
            <p><strong>Мережа:</strong> Захищена (Port 443)</p>
            <p><strong>Протокол:</strong> HTTPS / TLS 1.3</p>
            <p><strong>Стан:</strong> Дані зашифровано</p>
        </div>

        <div class="panel">
            <h1 data-text="САЙТ ДЛЯ ЛАБОРАТОРНОЇ">САЙТ ДЛЯ ЛАБОРАТОРНОЇ</h1>
            <p>Лабораторна робота виконана успішно. Статичний веб-сайт розгорнуто на платформі GitHub Pages. З'єднання захищено сертифікатом.</p>
            
            <h2>> Захищений канал зв'язку</h2>
            <form id="secure-form">
                <div class="input-group">
                    <input type="text" id="name" placeholder="ІДЕНТИФІКАТОР КОРИСТУВАЧА" required>
                </div>
                <div class="input-group">
                    <textarea id="message" rows="3" placeholder="ВВЕДІТЬ ПАКЕТ ДАНИХ ДЛЯ ПЕРЕДАЧІ..." required></textarea>
                </div>
                <button type="submit">Ініціювати передачу</button>
            </form>
        </div>
    </div>

    <script>
        /* 1. Скрипт для терміналу (друкує текст безпеки) */
        const terminalText = [
            "Ініціалізація з'єднання...",
            "Отримання SSL/TLS сертифіката: УСПІШНО",
            "Перевірка центру сертифікації: VALID",
            "Погодження ключа шифрування (RSA-2048)...",
            "Обмін ключами завершено.",
            "Mixed Content: НЕ ЗНАЙДЕНО",
            "Захищений тунель встановлено."
        ];
        const terminalOutput = document.getElementById('terminal-output');
        let lineIndex = 0;

        function typeLine() {
            if (lineIndex < terminalText.length) {
                const p = document.createElement('p');
                p.innerHTML = `> ${terminalText[lineIndex]}`;
                terminalOutput.appendChild(p);
                terminalOutput.scrollTop = terminalOutput.scrollHeight;
                lineIndex++;
                setTimeout(typeLine, Math.random() * 800 + 400); // Випадкова затримка
            } else {
                const p = document.createElement('p');
                p.style.color = "var(--cyan)";
                p.innerHTML = "> СИСТЕМА ГОТОВА.";
                terminalOutput.appendChild(p);
            }
        }
        setTimeout(typeLine, 1000);

        /* 2. Обробка форми */
        document.getElementById('secure-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "ШИФРУВАННЯ ТА ВІДПРАВКА...";
            btn.style.background = "var(--cyan)";
            btn.style.color = "#000";
            
            setTimeout(() => {
                alert("Пакет даних успішно зашифровано та доставлено на сервер!");
                e.target.reset();
                btn.innerText = "ІНІЦІЮВАТИ ПЕРЕДАЧУ";
                btn.style.background = "transparent";
                btn.style.color = "var(--cyan)";
            }, 1500);
        });

        /* 3. Частинки на фоні (Network Nodes) */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const numberOfParticles = (canvas.width * canvas.height) / 15000;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.directionX = (Math.random() - 0.5) * 1;
                this.directionY = (Math.random() - 0.5) * 1;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 243, 255, 0.5)';
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width / 7) * (canvas.height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = 'rgba(0, 243, 255, ' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
